<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome | CCSJDM System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;overflow:hidden;display:grid;place-items:center;background:#000;color:#e0f2fe;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
.grid{position:fixed;inset:0;opacity:.12;background-image:linear-gradient(rgba(217,70,239,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(217,70,239,.35) 1px,transparent 1px);background-size:42px 42px;mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.panel{position:relative;z-index:1;width:min(92vw,680px);padding:34px 24px;text-align:center;border:1px solid rgba(217,70,239,.35);border-radius:28px;background:rgba(10,6,20,.8);box-shadow:0 0 60px rgba(217,70,239,.15);animation:appear .8s ease both}
.kicker{color:#e879f9;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase}
h1{font-size:clamp(1.7rem,5vw,3rem);margin:14px 0 8px;background:linear-gradient(90deg,#f0abfc,#c4b5fd,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#9ca3af;line-height:1.6}
.robot-wrap{height:245px;display:grid;place-items:center;position:relative}
.robot{position:relative;width:150px;height:145px;animation:float 2.6s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(217,70,239,.35))}
.antenna{position:absolute;top:-23px;left:72px;width:6px;height:27px;background:#e879f9;border-radius:8px}
.antenna:before{content:"";position:absolute;top:-9px;left:-5px;width:16px;height:16px;border-radius:50%;background:#67e8f9;box-shadow:0 0 18px #67e8f9;animation:blink 1.1s infinite alternate}
.head{position:absolute;inset:10px 0 0;height:112px;border:3px solid #e879f9;border-radius:30px 30px 38px 38px;background:linear-gradient(145deg,#1e1033,#0a0614);box-shadow:inset 0 0 22px rgba(217,70,239,.15)}
.ear{position:absolute;top:48px;width:15px;height:36px;border:2px solid #67e8f9;background:#1a1040;border-radius:8px}
.ear.left{left:-12px}.ear.right{right:-12px}
.eyes{display:flex;justify-content:center;gap:30px;margin-top:31px}
.eye{width:16px;height:21px;border-radius:50%;background:#e879f9;box-shadow:0 0 16px #d946ef;animation:blink 3.4s infinite}
.mouth{width:35px;height:12px;margin:18px auto 0;border-bottom:4px solid #67e8f9;border-radius:0 0 20px 20px;transition:height .15s}
.robot.talking .mouth{animation:talk .25s infinite alternate}
.bodybot{position:absolute;top:124px;left:37px;width:76px;height:43px;border:2px solid #e879f9;border-radius:15px;background:#140a24}
.bodybot:before,.bodybot:after{content:"";position:absolute;top:13px;width:14px;height:5px;background:#e879f9;border-radius:4px}
.bodybot:before{left:12px}.bodybot:after{right:12px}
.bubble{display:inline-block;max-width:100%;margin:0 auto 22px;padding:14px 18px;border:1px solid rgba(232,121,249,.55);border-radius:16px;background:rgba(88,28,135,.2);color:#f5d0fe;line-height:1.5;min-height:52px}
.btn{border:0;border-radius:999px;padding:15px 28px;color:#fff;background:linear-gradient(135deg,#7011ce,#c026d3 55%,#3b82f6);font-family:inherit;font-size:1rem;font-weight:800;letter-spacing:.06em;cursor:pointer;box-shadow:0 12px 30px rgba(192,38,211,.35);transition:transform .2s}
.btn:hover:not(:disabled){transform:translateY(-3px)}
.btn:disabled{opacity:.7;cursor:wait}
.hint{margin-top:15px;color:#64748b;font-size:.78rem}
.status{margin-top:20px;color:#e879f9;font-size:.7rem;letter-spacing:.18em}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
@keyframes blink{from{opacity:.6}to{opacity:1}}
@keyframes talk{from{height:12px}to{height:22px}}
@keyframes appear{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="grid" aria-hidden="true"></div>
<main class="panel">
  <p class="kicker">CCSJDM // SYSTEM ONLINE</p>
  <h1>City College of San Jose Del Monte</h1>
  <p class="sub">Scheduling &amp; Management System</p>
  <div class="robot-wrap">
    <div class="robot" id="robot" aria-hidden="true">
      <div class="antenna"></div><div class="ear left"></div><div class="ear right"></div>
      <div class="head"><div class="eyes"><span class="eye"></span><span class="eye"></span></div><div class="mouth"></div></div>
      <div class="bodybot"></div>
    </div>
  </div>
  <div class="bubble" id="speech" aria-live="polite">Hello! Nandito na ako. Welcome to City College of San Jose Del Monte!</div>
  <div><button class="btn" id="startBtn" type="button">CLICK TO LOGIN&nbsp; ↗</button></div>
  <p class="hint">Tap the button to meet your cyber assistant and continue.</p>
  <p class="status" id="status">● READY FOR AUTHENTICATION</p>
</main>

<script>
const LOGIN_PAGE = "login.html";
const button = document.getElementById("startBtn");
const speech = document.getElementById("speech");
const statusLine = document.getElementById("status");
const robot = document.getElementById("robot");
let busy = false;

// ===== ROBOT BEEP (Web Audio, walang kailangang file) =====
let audioCtx = null;
function beep(freq, dur, delay = 0, type = "square", vol = 0.06) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.6, t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  } catch (e) {}
}
function robotBoot() {
  beep(300, 0.12, 0);
  beep(600, 0.10, 0.14);
  beep(900, 0.08, 0.28);
  beep(1400, 0.15, 0.40);
}

// ===== ROBOT VOICE (SpeechSynthesis, mababang pitch para parang robot) =====
let robotVoice = null;
function pickVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  robotVoice =
    voices.find(v => /en/i.test(v.lang) && /male|david|mark|google uk english male/i.test(v.name)) ||
    voices.find(v => /en/i.test(v.lang)) ||
    voices[0] || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function robotSpeak(text, onDone) {
  let finished = false;
  const finish = () => { if (!finished) { finished = true; robot.classList.remove("talking"); onDone(); } };

  if (!("speechSynthesis" in window)) return finish();

  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  if (robotVoice) u.voice = robotVoice;
  u.lang = "en-US";
  u.pitch = 0.2;   // pinakamababa para tunog robot
  u.rate = 0.82;   // mabagal, parang makina
  u.volume = 1;
  u.onstart = () => robot.classList.add("talking");
  u.onend = finish;
  u.onerror = finish;
  speechSynthesis.speak(u);

  // Backup: tuloy pa rin kahit hindi gumana ang boses
  setTimeout(finish, 7000);
}

// ===== CLICK =====
button.addEventListener("click", () => {
  if (busy) return;
  busy = true;
  button.disabled = true;
  button.textContent = "CONNECTING...";
  speech.textContent = "Hello! Welcome to City College of San Jose Del Monte. Ihahanda ko na ang login page mo!";
  statusLine.textContent = "● CYBER ASSISTANT CONNECTING";

  robotBoot();
  setTimeout(() => {
    robotSpeak("Hello. Welcome to City College of San Jose Del Monte. Preparing login page.", () => {
      window.location.href = LOGIN_PAGE;
    });
  }, 600);
});
</script>
</body>
</html>
