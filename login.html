
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCSJDM | Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0b0f19;
    color:white;
    font-family:"Segoe UI",Arial,sans-serif;
    padding:20px;
}

.card{
    width:100%;
    max-width:430px;
    padding:38px;
    background:#151a2b;
    border:1px solid #55418b;
    border-radius:24px;
    box-shadow:0 20px 70px #0008;
}

.logo{
    width:85px;
    height:85px;
    margin:0 auto 20px;
    border-radius:50%;
    overflow:hidden;
    border:3px solid #a855f7;
}

.logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

h1{
    text-align:center;
    color:#c4b5fd;
}

.sub{
    text-align:center;
    color:#999bb5;
    margin:8px 0 30px;
}

label{
    display:block;
    color:#c4b5fd;
    margin:15px 0 8px;
    font-size:13px;
    font-weight:bold;
}

input{
    width:100%;
    padding:15px;
    background:#0b1020;
    border:1px solid #393653;
    border-radius:12px;
    color:white;
    outline:none;
}

input:focus{
    border-color:#c026d3;
}

button{
    width:100%;
    padding:15px;
    margin-top:25px;
    border:0;
    border-radius:12px;
    background:linear-gradient(120deg,#7011ce,#c026d3,#3b82f6);
    color:white;
    font-weight:bold;
    cursor:pointer;
}

#message{
    margin-top:15px;
    text-align:center;
    color:#fca5a5;
    font-size:14px;
}

a{
    color:#c4b5fd;
    text-decoration:none;
}

.links{
    text-align:center;
    margin-top:25px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="card">

    <div class="logo">
        <img src="backgroundcc.jpg" alt="CCSJDM Logo">
    </div>

    <h1>CCSJDM LOGIN</h1>

    <p class="sub">Scheduling & Management System</p>

    <form id="loginForm">

        <label>PROFESSOR</label>
        <input type="text" id="loginID"
        placeholder="Enter your ID" required>

        <label>PASSWORD</label>
        <input type="password" id="loginPassword"
        placeholder="Enter your password" required>

        <button type="submit" id="loginBtn">
            SIGN IN
        </button>

    </form>

    <p id="message"></p>

    <div class="links">
        Don't have an account?
        <a href="signup.html">Create Account</a>
    </div>

</div>

<script>

const KEY_USERS = "ccsjdm_users";

const DEFAULT_USERS = [
  {
    "id": "ADMIN013",
    "fullName": "Harold",
    "role": "admin",
    "status": "approved",
    "salt": "c6ee2cc08a1901cd1d9154901d2f9750",
    "hash": "2b4b130805d946cd1d51aeb2d412fbb71122c41a8e79636cebd09f44db326ad3"
  },
  {
    "id": "bingsy",
    "fullName": "Bingsy",
    "role": "superadmin",
    "status": "approved",
    "salt": "4f8ecf16ee4831e5ad27cbed4c73841c",
    "hash": "18dca148320564bc7ee8bff1d7ec637fdc4c76be1bc8235d41f46efd5da01988"
  },
  {
    "id": "editor01",
    "fullName": "Editor Sample",
    "role": "editor",
    "status": "approved",
    "salt": "88ba2cd83cfe91d7d1b9a6a54e8b7a52",
    "hash": "140ce0b98060d6da9a6cf479f9144c52b9b8c983b71a3e6a8773f890ecf2cde1"
  },
  {
    "id": "viewer01",
    "fullName": "Viewer Sample",
    "role": "viewer",
    "status": "approved",
    "salt": "ecf1a4ad9e566f974f1917988797844e",
    "hash": "048a67c6ef2a9e37bb2f7b28a81eca0e4309304cdee98787640f85d744d4b74e"
  }
];

function normalizeRole(r) {
    const v = String(r || "").toLowerCase();
    return ["superadmin", "admin", "editor", "viewer"].includes(v) ? v : "viewer";
}

// Idinadagdag lang ang default accounts kung wala pa; hindi ino-overwrite ang existing
function seedUsers() {
    const users = getUsers();
    let changed = false;
    DEFAULT_USERS.forEach(d => {
        if (!users.some(u => String(u.id).trim().toLowerCase() === d.id.toLowerCase())) {
            users.push(d);
            changed = true;
        }
    });
    if (changed) localStorage.setItem(KEY_USERS, JSON.stringify(users));
}
seedUsers();

function getUsers() {
    try {
        return JSON.parse(localStorage.getItem(KEY_USERS)) || [];
    } catch (e) {
        return [];
    }
}

const $ = id => document.getElementById(id);

async function hashPw(password, salt) {
    const text = salt + ":" + password;

    const result = await crypto.subtle.digest(
        "SHA-256",
        new TextEncoder().encode(text)
    );

    return Array.from(new Uint8Array(result))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
}

$("loginForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const id = $("loginID").value.trim();
    const password = $("loginPassword").value;

    const btn = $("loginBtn");
    const message = $("message");

    message.textContent = "";
    btn.disabled = true;
    btn.textContent = "VERIFYING...";

    try {
        const users = getUsers();

        const user = users.find(u =>
            String(u.id).trim().toLowerCase() === id.toLowerCase()
        );

        if (!user) {
            message.textContent = "Account not found.";
            return;
        }

        let passwordCorrect = false;

        // Check hashed password
        if (user.hash && user.salt) {
            const hashed = await hashPw(password, user.salt);
            passwordCorrect = hashed === user.hash;
        }

        // Check older signup format
        else if (user.password !== undefined) {
            passwordCorrect = String(user.password) === password;
        }

        if (!passwordCorrect) {
            message.textContent = "Incorrect password.";
            return;
        }

        if (user.status === "rejected") {
            message.textContent = "Your account was rejected.";
            return;
        }

        if (user.status === "pending") {
            message.textContent = "Waiting for Admin approval.";
            return;
        }

        sessionStorage.setItem(
            "ccsjdm_current",
            JSON.stringify({ id: user.id, fullName: user.fullName || user.id, role: normalizeRole(user.role) })
        );

        location.replace("main.html");

    } catch (error) {
        console.error(error);
        message.textContent = "Login error. Please try again.";
    } finally {
        btn.disabled = false;
        btn.textContent = "SIGN IN";
    }
});

</script>

</body>
</html>
